plugins {
    id 'base'
    id 'idea'
}

allprojects {
    group = project.mod_group_id
    version = project.mod_version
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('buildVersion2612', GradleBuild) {
    dir = file('.')
    tasks = [':fabric:build', ':neoforge:build']
}

tasks.register('buildVersion262', GradleBuild) {
    dir = file('versions/26.2')
    tasks = [':fabric:build', ':neoforge:build']
}

tasks.register('buildVersion263', GradleBuild) {
    dir = file('versions/26.3')
    tasks = [':fabric:build', ':neoforge:build']
}

tasks.register('assembleAllVersions') {
    dependsOn 'buildVersion2612', 'buildVersion262', 'buildVersion263'
    doLast {
        def output = file('build/all-versions')
        delete output
        output.mkdirs()
        def targets = [
                ['26.1.2', file('fabric/build/libs'), file('neoforge/build/libs')],
                ['26.2', file('versions/26.2/fabric/build/libs'), file('versions/26.2/neoforge/build/libs')],
                ['26.3', file('versions/26.3/fabric/build/libs'), file('versions/26.3/neoforge/build/libs')]
        ]
        targets.each { target ->
            [['fabric', target[1]], ['neoforge', target[2]]].each { entry ->
                def loader = entry[0]
                def directory = entry[1]
                def expectedName = "${project.mod_id}-${loader}-${target[0]}-${project.mod_version}.jar"
                def jar = directory.listFiles()?.find { it.name == expectedName }
                if (jar == null) {
                    throw new GradleException("Missing expected artifact ${expectedName} in ${directory}")
                }
                copy {
                    from jar
                    into new File(output, "${target[0]}/${loader}")
                }
            }
        }
        file('build/all-versions/manifest.txt').text = targets.collect { "${it[0]} fabric + neoforge" }.join(System.lineSeparator())
    }
}

tasks.register('assembleAll') {
    dependsOn 'assembleAllVersions'
}

tasks.register('printRunMatrix') {
    doLast {
        println 'Client/server runs are generated by Fabric Loom and NeoForge ModDev for each loader/version project.'
        println 'Aggregate build: assembleAllVersions'
    }
}
