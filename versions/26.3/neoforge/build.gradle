plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases/' }
}

sourceSets.main.java.srcDirs = [
        rootProject.file('../../common/src/main/java'),
        rootProject.file('../../neoforge/src/main/java'),
        project.file('src/main/java')
]
sourceSets.main.resources.srcDirs = [
        rootProject.file('../../common/src/main/resources'),
        rootProject.file('common/src/main/resources'),
        project.file('src/main/resources')
]

neoForge {
    version = rootProject.neoforge_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        thelostcamera { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(rootProject.java_version)
    options.encoding = 'UTF-8'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

base { archivesName = "${rootProject.mod_id}-neoforge-${rootProject.minecraft_version}" }
